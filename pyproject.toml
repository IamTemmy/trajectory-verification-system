[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-verification-system"
version = "0.1.0"
description = "Requirements-driven trajectory verification and failure attribution"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Temiloluwa Adesola" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["protobuf>=4.25,<7"]

[project.scripts]
verify-trajectories = "trajectory_verification.cli:main"
inspect-womd = "trajectory_verification.womd_cli:main"
verify-womd = "trajectory_verification.womd_verify_cli:main"
compare-trajectories = "trajectory_verification.regression_cli:main"
evaluate-motion-predictions = "trajectory_verification.motion_evaluate_cli:main"
generate-womd-baseline = "trajectory_verification.baseline_cli:main"
compare-prediction-evaluations = "trajectory_verification.prediction_compare_cli:main"
run-prediction-experiment = "trajectory_verification.experiment_cli:main"
analyze-prediction-risk = "trajectory_verification.prediction_risk_cli:main"
visualize-predictions = "trajectory_verification.prediction_visual_cli:main"
import-external-predictions = "trajectory_verification.external_prediction_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
